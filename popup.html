<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Garmin Stats for ChatGPT/Claude</title>
  <style>
    body { width: 360px; margin: 0; padding: 16px; font: 13px/1.4 system-ui, sans-serif; color: #1a1a1a; }
    header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
    h1 { font-size: 15px; margin: 0; }
    .lang { display: flex; border: 1px solid #ddd; border-radius: 999px; overflow: hidden; }
    .lang button { padding: 2px 8px; border: 0; border-radius: 0; background: #fff; color: #555; font-size: 11px; font-weight: 600; }
    .lang button.on { background: #0891b2; color: #fff; }
    fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 0 0 12px; padding: 8px 12px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; margin: 4px 0; cursor: pointer; }
    #days { display: block; width: 100%; margin: 4px 0; padding: 4px; }
    [hidden] { display: none !important; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font: inherit; }
    button.primary { width: 100%; background: #0891b2; border-color: #0891b2; color: #fff; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin: 10px 0; min-height: 1em; color: #555; display: flex; align-items: center; gap: 8px; }
    .spinner { width: 14px; height: 14px; flex: none; border: 2px solid #eee; border-top-color: #0891b2; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #progress { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    #progress-bar { height: 100%; width: 0; background: #0891b2; transition: width .3s; }
    #status.error { color: #b00020; }
    textarea { width: 100%; height: 160px; box-sizing: border-box; font: 11px/1.4 ui-monospace, monospace; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row button { flex: 1; }
    .note { color: #777; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="fr">FR</button></div>
  </header>

  <fieldset>
    <legend data-i18n="period"></legend>
    <select id="days"></select>
    <div id="since" hidden></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="data"></legend>
    <label><input type="checkbox" id="activities" checked> <span data-i18n="activities"></span>
      <select id="sport">
        <option value="all" data-i18n="sportAll"></option>
        <option value="running" data-i18n="sportRunning"></option>
        <option value="strength" data-i18n="sportStrength"></option>
        <option value="cycling" data-i18n="sportCycling"></option>
        <option value="swimming" data-i18n="sportSwimming"></option>
        <option value="walking" data-i18n="sportWalking"></option>
      </select>
    </label>
    <label><input type="checkbox" id="details"> <span data-i18n="details"></span></label>
    <label><input type="checkbox" id="stress" checked> <span data-i18n="stress"></span></label>
    <label><input type="checkbox" id="cycle"> <span data-i18n="cycle"></span></label>
    <label><input type="checkbox" id="daily" checked> <span data-i18n="daily"></span></label>
    <label><input type="checkbox" id="fitness" checked> <span data-i18n="fitness"></span></label>
  </fieldset>

  <button class="primary" id="go" data-i18n="popupGo"></button>
  <div id="progress" hidden><div id="progress-bar"></div></div>
  <div id="status"></div>

  <div id="result" hidden>
    <textarea id="output" readonly></textarea>
    <div class="row">
      <button id="copy" data-i18n="copy"></button>
      <button id="download" data-i18n="download"></button>
    </div>
    <p class="note" data-i18n="pasteNote"></p>
  </div>

  <p class="note" data-i18n="loginNote"></p>
  <script src="i18n.js"></script>
  <script src="periods.js"></script>
  <script src="collector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
