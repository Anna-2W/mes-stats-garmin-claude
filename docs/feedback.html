<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback · My Garmin Stats for ChatGPT/Claude</title>
<link rel="icon" href="icon128.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 0 20px 48px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #0b1f26;
    background:
      radial-gradient(900px 620px at 88% 0%, rgba(94,224,216,.38), transparent 62%),
      radial-gradient(760px 520px at 0% 100%, rgba(8,145,178,.16), transparent 60%),
      #f3f8f9;
  }
  a { color: #0e7490; }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: inherit; text-decoration: none; }
  .brand img { width: 36px; height: 36px; }
  .lang { display: flex; border: 1px solid #cfdfe3; border-radius: 999px; overflow: hidden; background: #fff; }
  .lang button { padding: 5px 12px; border: 0; background: none; font: 600 13px inherit; color: #46616a; cursor: pointer; }
  .lang button.on { background: #0891b2; color: #fff; }
  h1 { margin: 40px 0 12px; font-size: clamp(32px, 6vw, 48px); line-height: 1.08; letter-spacing: -.025em; text-align: center; }
  h1 em { font-style: normal; color: #0891b2; }
  .lead { max-width: 620px; margin: 0 auto 40px; text-align: center; color: #46616a; font-size: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; padding: 26px 24px; border-radius: 20px; background: #fff; color: inherit; text-decoration: none;
    box-shadow: 0 1px 2px rgba(11,31,38,.06), 0 20px 50px -20px rgba(11,31,38,.25); transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(11,31,38,.06), 0 26px 60px -20px rgba(11,31,38,.35); }
  .icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: #e3f5f8; color: #0891b2; }
  .card h2 { margin: 18px 0 6px; font-size: 20px; }
  .card p { margin: 0 0 20px; color: #56717a; font-size: 15px; flex: 1; }
  .card .go { font-weight: 650; color: #0891b2; }
  .tips { margin-top: 36px; padding: 24px 26px; border-radius: 20px; background: rgba(255,255,255,.7); border: 1px solid #dbe9ec; }
  .tips h3 { margin: 0 0 10px; font-size: 17px; }
  .tips ul { margin: 0; padding-left: 20px; color: #2c464e; }
  .tips li { margin: 6px 0; }
  .note { margin-top: 18px; text-align: center; color: #6b8790; font-size: 14px; }
  footer { margin-top: 40px; text-align: center; font-size: 14px; color: #6b8790; }
  footer a { margin: 0 8px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://chromewebstore.google.com/detail/alhbbbmaheeddjcpdbalahaihfbajeff"><img src="icon128.png" alt=""><span data-t="name"></span></a>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="fr">FR</button></div>
  </header>

  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="cards">
    <a class="card" id="bug" target="_blank" rel="noopener">
      <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1V6a3 3 0 0 1 6 0v1.1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6Z"/><path d="M12 20v-9M6.5 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.97 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg></span>
      <h2 data-t="bugTitle"></h2>
      <p data-t="bugText"></p>
      <span class="go" data-t="bugGo"></span>
    </a>
    <a class="card" id="idea" target="_blank" rel="noopener">
      <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg></span>
      <h2 data-t="ideaTitle"></h2>
      <p data-t="ideaText"></p>
      <span class="go" data-t="ideaGo"></span>
    </a>
    <a class="card" id="question" target="_blank" rel="noopener">
      <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
      <h2 data-t="askTitle"></h2>
      <p data-t="askText"></p>
      <span class="go" data-t="askGo"></span>
    </a>
  </div>
  <p class="note" data-t="github"></p>

  <div class="tips">
    <h3 data-t="tipsTitle"></h3>
    <ul>
      <li data-t="tip1"></li>
      <li data-t="tip2"></li>
      <li data-t="tip3"></li>
      <li data-t="tip4"></li>
    </ul>
  </div>

  <footer>
    <a href="privacy.html" data-t="privacy"></a> · <a href="https://chromewebstore.google.com/detail/alhbbbmaheeddjcpdbalahaihfbajeff">Chrome Web Store</a> · <a href="https://github.com/Anna-2W/mes-stats-garmin-claude" data-t="source"></a>
  </footer>
</div>
<script>
  const REPO = "https://github.com/Anna-2W/mes-stats-garmin-claude";
  const TEXT = {
    en: {
      name: "My Garmin Stats for ChatGPT/Claude",
      title: "Found a bug? <em>Have an idea?</em>",
      lead: "This extension is a free side project. Your feedback is what makes it better: every message is read.",
      bugTitle: "Report a bug", bugText: "An error message, a missing value, the button doesn't show up...", bugGo: "Report a bug →",
      ideaTitle: "Suggest an idea", ideaText: "A metric you'd like to see, another AI chat, another sport...", ideaGo: "Share your idea →",
      askTitle: "Ask a question", askText: "Not sure how something works? Ask away.", askGo: "Ask a question →",
      github: "These forms are hosted on GitHub: you'll need a free GitHub account to send them.",
      tipsTitle: "Before reporting a bug",
      tip1: "Reload the Claude or ChatGPT page, especially right after the extension was updated.",
      tip2: "Make sure you're signed in to connect.garmin.com in the same browser.",
      tip3: "On ChatGPT, attaching files requires being signed in to your ChatGPT account. Otherwise, use \"Copy text\".",
      tip4: "<b>Never share your Garmin data file</b>: it contains your health data. A screenshot of the error is enough.",
      privacy: "Privacy policy", source: "Source code",
    },
    fr: {
      name: "Mes Stats Garmin pour ChatGPT/Claude",
      title: "Un bug ? <em>Une idée ?</em>",
      lead: "Cette extension est un projet perso gratuit. Tes retours la rendent meilleure : chaque message est lu.",
      bugTitle: "Signaler un bug", bugText: "Un message d'erreur, une valeur manquante, le bouton qui n'apparaît pas...", bugGo: "Signaler un bug →",
      ideaTitle: "Proposer une idée", ideaText: "Une donnée que tu aimerais voir, un autre chat IA, un autre sport...", ideaGo: "Partager mon idée →",
      askTitle: "Poser une question", askText: "Tu ne sais pas comment quelque chose marche ? Demande.", askGo: "Poser ma question →",
      github: "Ces formulaires sont hébergés sur GitHub : il faut un compte GitHub gratuit pour les envoyer.",
      tipsTitle: "Avant de signaler un bug",
      tip1: "Recharge la page Claude ou ChatGPT, surtout juste après une mise à jour de l'extension.",
      tip2: "Vérifie que tu es connecté·e à connect.garmin.com dans le même navigateur.",
      tip3: "Sur ChatGPT, joindre un fichier demande d'être connecté·e à son compte ChatGPT. Sinon, utilise « Copier le texte ».",
      tip4: "<b>Ne partage jamais ton fichier de données Garmin</b> : il contient tes données de santé. Une capture de l'erreur suffit.",
      privacy: "Politique de confidentialité", source: "Code source",
    },
  };
  const params = new URLSearchParams(location.search);
  const version = (params.get("v") || "").replace(/[^0-9.]/g, "");
  document.getElementById("bug").href = `${REPO}/issues/new?template=bug.yml${version ? `&version=${version}` : ""}`;
  document.getElementById("idea").href = `${REPO}/issues/new?template=idea.yml`;
  document.getElementById("question").href = `${REPO}/issues/new`;

  function show(lang) {
    const T = TEXT[lang] || TEXT.en;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = T[el.dataset.t]));
    document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  }
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => show(b.dataset.lang)));
  show(params.get("lang") === "fr" ? "fr" : "en");
</script>
</body>
</html>
